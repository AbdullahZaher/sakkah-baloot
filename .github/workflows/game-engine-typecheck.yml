name: game-engine-typecheck

on:
  push:
    paths:
      - "packages/game-engine/**"
      - ".github/workflows/game-engine-typecheck.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/game-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/game-engine/package.json
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
