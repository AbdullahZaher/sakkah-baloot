name: game-client-test

on:
  push:
    paths:
      - "packages/game-client/**"
      - "packages/game-engine/**"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "packages/game-client/**"
      - "packages/game-engine/**"
      - "package.json"
      - "pnpm-workspace.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @sakkah-baloot/game-engine build
      - run: pnpm --filter @sakkah-baloot/game-client typecheck
      - run: pnpm --filter @sakkah-baloot/game-client test
