name: simulator-stress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/game-simulator/**"
      - "packages/game-engine/**"
      - ".github/workflows/simulator-stress.yml"

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        games: [1000, 10000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @sakkah-baloot/game-engine build
      - run: pnpm --filter @sakkah-baloot/game-engine build
      - run: pnpm --filter @sakkah-baloot/game-ai build
      - run: pnpm --filter @sakkah-baloot/game-simulator build
      - run: SIMULATION_GAMES=${{ matrix.games }} node --import tsx packages/game-simulator/scripts/stress-simulation.mjs
