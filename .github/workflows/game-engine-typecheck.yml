name: game-engine-typecheck

on:
  push:
    paths:
      - "packages/game-engine/**"
      - ".github/workflows/game-engine-typecheck.yml"

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/game-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/game-engine/package.json
      - run: npm install --ignore-scripts
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
      - name: Persist typecheck diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          log = open("/tmp/typecheck.log", "r", encoding="utf-8").read()
          body = f"Commit: {os.environ['GITHUB_SHA']}\\n\\n{log}"
          payload = json.dumps({
              "message": "ci: persist typecheck diagnostics",
              "content": base64.b64encode(body.encode()).decode(),
              "branch": os.environ["GITHUB_REF_NAME"],
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/ci/typecheck-error.txt",
              data=payload,
              method="PUT",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as response:
              print(response.read().decode())
          PY
      - run: npm test
