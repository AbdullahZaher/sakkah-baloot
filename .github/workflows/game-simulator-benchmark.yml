name: game-simulator-benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @sakkah-baloot/game-engine build
      - run: pnpm --filter @sakkah-baloot/game-protocol build
      - run: pnpm --filter @sakkah-baloot/game-ai build
      - run: pnpm --filter @sakkah-baloot/game-simulator typecheck
      - run: pnpm --filter @sakkah-baloot/game-simulator build
      - run: node packages/game-simulator/scripts/benchmark-suite.mjs
