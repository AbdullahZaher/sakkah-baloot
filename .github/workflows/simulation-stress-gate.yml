name: simulation-stress-gate

on:
  workflow_dispatch:

jobs:
  stress-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @sakkah-baloot/game-engine build
      - run: pnpm --filter @sakkah-baloot/game-simulator build
      - run: SIMULATION_GAMES=1000 SIMULATION_MAX_ROUNDS=40 node --import tsx packages/game-simulator/test/stress-gate.mjs

  stress-10000:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @sakkah-baloot/game-engine build
      - run: pnpm --filter @sakkah-baloot/game-simulator build
      - run: SIMULATION_GAMES=10000 SIMULATION_MAX_ROUNDS=40 node --import tsx packages/game-simulator/test/stress-gate.mjs
